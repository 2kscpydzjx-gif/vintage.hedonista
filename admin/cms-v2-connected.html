<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vintage Hedonista — редактор V2</title><style>
:root{--bg:#171310;--line:#332b25;--fg:#eee9e3;--muted:#a49b91;--gold:#c9a784}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font:13px Arial,sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:hover{filter:brightness(1.15)}.app{height:100vh;display:grid;grid-template-rows:74px minmax(0,1fr)}.top{display:grid;grid-template-columns:308px minmax(0,1fr) 340px;align-items:center;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:19px;padding-left:24px}.vh{font:38px Georgia,serif;letter-spacing:-5px;color:#f4e8dc}.brandname{font-size:14px}.brandname small{display:block;font-size:9px;color:#b6a59a;margin-top:4px;letter-spacing:.6px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;min-width:0}.toolbar select{background:#26201c;border:0;border-radius:4px;padding:12px;min-width:160px}.devices{display:flex;gap:8px}.devices button,.iconbtn{border:1px solid transparent;background:transparent;border-radius:4px;padding:10px;min-width:38px}.devices button.active{background:#342a23;border-color:#76604d}.toolbar svg,.tab svg,.rtabs svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.topactions{display:flex;justify-content:flex-end;gap:9px;padding:0 20px 0 0}.topactions button{border:1px solid #8a7768;border-radius:4px;background:transparent;padding:12px 14px;white-space:nowrap}.topactions #publish{background:#d2b08f;color:#211915;border-color:#d2b08f}.workspace{display:grid;grid-template-columns:308px minmax(0,1fr) 340px;min-height:0}.left,.right{min-height:0;display:flex;flex-direction:column;background:var(--bg)}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.tabs,.rtabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}.tab{height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:transparent;border:0;color:#aaa19a}.tab.active,.rtabs button.active{color:white;background:#26201d;border-bottom:2px solid var(--gold)}.sidehead{font-size:11px;letter-spacing:1px;color:#948579;padding:19px 19px 12px}.blocklist{overflow:auto;flex:1;min-height:0;padding:0 9px}.block{display:flex;align-items:center;width:100%;height:63px;gap:9px;border:0;border-bottom:1px solid #302923;background:transparent;text-align:left;padding:6px 4px}.block.active{background:#352a22;outline:1px solid #c9a989;outline-offset:-1px;border-radius:3px}.num{font-size:11px;color:#8e8075;min-width:15px}.thumb{width:61px;height:44px;object-fit:cover;border-radius:3px;background:#29221e}.blocktitle{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:18px}.more{color:#b9aaa0}.addwrap{padding:16px 19px 21px}.add{height:42px;width:100%;border:0;background:#29231f;border-radius:4px}.preview{background:#120f0d;min-width:0;min-height:0;overflow:auto}.preview-inner{height:100%;width:100%;position:relative}.preview iframe{display:block;border:0;width:100%;height:100%;background:#120f0d}.paneltitle{height:56px;flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;padding:0 19px;font-size:17px}.count{font-size:11px;background:#29231f;color:#a99d94;border-radius:4px;padding:6px 9px}.rtabs{height:51px;flex:0 0 51px}.rtabs button{border:0;background:transparent;color:#aaa19a;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px}.rtabs svg{width:14px;height:14px}.fields{padding:20px 19px;overflow:auto;min-height:0;flex:1}.field{margin:0 0 22px}.field label{display:block;color:#aa9c90;font-size:11px;letter-spacing:.6px;margin-bottom:11px}.field input,.field textarea,.field select{width:100%;background:transparent;border:1px solid #41352d;border-radius:4px;padding:12px;outline:none}.field textarea{height:84px;resize:vertical}.photo{display:flex;gap:10px}.photo img{width:140px;height:99px;object-fit:cover;border-radius:4px;background:#2b231e}.photoactions{display:flex;flex:1;flex-direction:column;gap:8px}.photoactions button{flex:1;background:#29231f;border:0;border-radius:4px}.notice{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);padding:10px 18px;background:#342a23;border:1px solid var(--gold);border-radius:4px;display:none;z-index:20}.hidden{display:none!important}.menu{position:fixed;background:#28211c;border:1px solid #685440;z-index:50;padding:5px;border-radius:5px}.menu button{display:block;width:170px;text-align:left;border:0;background:transparent;padding:10px}.settings{padding-top:8px;border-top:1px solid var(--line)}.settings button{background:#2a231e;border:0;padding:9px 13px;border-radius:4px}.settings button.active{background:var(--gold);color:#1e1712}.settingsline{display:flex;align-items:center;justify-content:space-between;margin:18px 0}.settings input[type=range]{width:120px;accent-color:var(--gold)}.status{font-size:11px;color:#a89c91;padding:8px 0}.backend{position:fixed;left:-200vw;top:0;width:1200px;height:850px;visibility:hidden;pointer-events:none}@media(max-width:1050px){.top,.workspace{grid-template-columns:260px minmax(0,1fr) 300px}.brand{padding-left:12px}.toolbar{gap:3px}.topactions{padding-right:6px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="vh">VH</div><div class="brandname">Редактор сторінок<small>VINTAGE HEDONISTA</small></div></div><div class="toolbar"><select id="page" aria-label="Сторінка"><option>Головна</option></select><div class="devices"><button data-device="desktop" class="active" title="Комп’ютер">▣</button><button data-device="tablet" title="Планшет">▯</button><button data-device="mobile" title="Телефон">♙</button></div><button class="iconbtn" id="zoom">100%⌄</button><button class="iconbtn" id="undo" title="Скасувати">↶</button><button class="iconbtn" id="redo" title="Повторити">↷</button></div><div class="topactions"><button id="save">Зберегти чернетку</button><button id="publish">Опублікувати</button><button id="extra" title="Додатково">•••</button></div></header><div class="workspace"><aside class="left"><div class="tabs"><button class="tab" data-tab="pages">▤<span>Сторінки</span></button><button class="tab active" data-tab="blocks">▦<span>Блоки</span></button><button class="tab" data-tab="styles">♧<span>Стилі</span></button></div><div class="sidehead" id="sidehead">СТРУКТУРА СТОРІНКИ</div><div class="blocklist" id="blocklist"></div><div class="addwrap"><button class="add" id="add">＋ Додати блок</button></div></aside><section class="preview"><div class="preview-inner" id="preview"><p style="padding:15px;color:#b3a69c">Завантаження перегляду…</p></div></section><aside class="right"><div class="paneltitle"><span id="paneltitle">Оберіть блок</span><span class="count" id="count"></span></div><div class="rtabs"><button class="active" data-rtab="content">▧ Контент</button><button data-rtab="design">◉ Дизайн</button><button data-rtab="animation">◷ Анімація</button></div><div class="fields" id="fields"><div class="field"><label>ФОНОВЕ ЗОБРАЖЕННЯ</label><div class="photo"><img id="photo" alt=""><div class="photoactions"><button id="changePhoto">Замінити фото</button><button id="editPhoto">Редагувати</button></div></div></div><div class="field"><label>ЗАГОЛОВОК</label><input id="title"></div><div class="field"><label>ПІДЗАГОЛОВОК</label><textarea id="description"></textarea></div><div class="field"><label>КНОПКА</label><input id="cta"></div><div class="settings"><div class="settingsline">НАЛАШТУВАННЯ БЛОКУ</div><div class="settingsline">Висота <span><button data-size="S">S</button> <button data-size="M">M</button> <button data-size="L" class="active">L</button></span></div><div class="settingsline">Затемнення фону <input id="darkness" type="range" min="0" max="100" value="49"></div><div class="settingsline">Навігація слайдів <input id="navigation" type="checkbox" checked></div></div><div class="status" id="status">Підключення CMS…</div></div></aside></div></div><iframe class="backend" id="backend" src="cms-builder.html" title="CMS backend"></iframe><div class="notice" id="notice"></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),back=$('backend');let doc=null,rows=[],selected=-1,editing=null,activeTab='content',busy=false;
function notify(message){$('notice').textContent=message;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',3000)}
function originalRows(){return [...doc.querySelectorAll('#existingBlocks .existing-row')]}
function fieldCandidates(){const scope=doc.querySelector('#existingEditor:not([hidden])')||doc.querySelector('#editorFields');return scope?[...scope.querySelectorAll('input:not([type=hidden]):not([type=file]),textarea,[contenteditable=true]')]:[]}
function byLabel(regex){const scope=doc.querySelector('#existingEditor:not([hidden])')||doc.querySelector('#editorFields');if(!scope)return null;for(const el of scope.querySelectorAll('label')){if(regex.test(el.textContent||'')){const id=el.getAttribute('for');const input=id?doc.getElementById(id):el.querySelector('input,textarea');if(input)return input;const next=el.nextElementSibling;if(next?.matches('input,textarea'))return next}}return null}
function change(input,value){if(!input)return false;const setter=Object.getOwnPropertyDescriptor(input.tagName==='TEXTAREA'?HTMLTextAreaElement.prototype:HTMLInputElement.prototype,'value')?.set;if(setter)setter.call(input,value);else input.value=value;input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));return true}
function sync(){if(!doc)return;rows=originalRows();const list=$('blocklist');list.innerHTML='';rows.forEach((row,i)=>{const b=row.querySelector('.existing-select');if(!b)return;const title=b.querySelector('.studio-row-name')?.textContent?.trim()||b.textContent.trim().replace(/^\d+\s*[·.]?\s*/,'');const img=b.querySelector('img')||b.querySelector('.studio-row-thumb');const active=b.classList.contains('active');if(active)selected=i;const el=document.createElement('button');el.className='block'+(active?' active':'');const num=document.createElement('span');num.className='num';num.textContent=String(i+1).padStart(2,'0');const thumb=document.createElement('img');thumb.className='thumb';if(img?.src)thumb.src=img.src;else if(img?.style.backgroundImage){const m=img.style.backgroundImage.match(/url\(["']?(.*?)["']?\)/);if(m)thumb.src=m[1]}const label=document.createElement('span');label.className='blocktitle';label.textContent=title;const more=document.createElement('span');more.className='more';more.textContent='•••';el.append(num,thumb,label,more);el.onclick=e=>{if(e.target===more){e.stopPropagation();const native=row.querySelector('.studio-row-menu-trigger');if(native)native.click();else notify('Меню доступне в CMS');return}b.click();setTimeout(sync,80)};list.append(el)});if(selected<0||selected>=rows.length)selected=0;const active=rows[selected]?.querySelector('.existing-select');$('paneltitle').textContent=active?.querySelector('.studio-row-name')?.textContent?.trim()||active?.textContent?.trim()||'Оберіть блок';$('count').textContent=rows.length?'Блок '+(selected+1)+' з '+rows.length:'';const scope=doc.querySelector('#existingEditor:not([hidden])')||doc.querySelector('#editorFields');const photo=scope?.querySelector('.photo-field img,.cms-thumb-box img,img');if(photo?.src)$('photo').src=photo.src;else $('photo').removeAttribute('src');const heading=byLabel(/заголовок|назва/i),desc=byLabel(/підзаголовок|опис/i),cta=byLabel(/кнопк/i);editing={heading,desc,cta};$('title').value=heading?.value||'';$('description').value=desc?.value||'';$('cta').value=cta?.value||'';$('status').textContent='Редактор підключено · '+rows.length+' блоків'}
function setup(){try{doc=back.contentDocument;if(!doc?.querySelector('#existingBlocks'))throw Error('CMS ще не завантажена');const live=doc.getElementById('siteFrame');if(live){$('preview').replaceChildren(live);live.style.cssText='width:100%;height:100%;border:0;display:block';}const pages=doc.getElementById('studioPage');if(pages){$('page').innerHTML=pages.innerHTML;$('page').value=pages.value;$('page').onchange=()=>{pages.value=$('page').value;pages.dispatchEvent(new Event('change',{bubbles:true}));setTimeout(sync,900)}}const list=doc.getElementById('existingBlocks');new MutationObserver(()=>{if(!busy){busy=true;requestAnimationFrame(()=>{busy=false;sync()})}}).observe(list,{childList:true});sync()}catch(e){$('status').textContent='Не вдалося підключити CMS: '+e.message;notify('CMS недоступна')}}
back.addEventListener('load',setup);$('title').onchange=()=>{if(!change(editing?.heading,$('title').value))notify('Поле заголовка не знайдено');setTimeout(sync,100)};$('description').onchange=()=>{if(!change(editing?.desc,$('description').value))notify('Поле опису не знайдено')};$('cta').onchange=()=>{if(!change(editing?.cta,$('cta').value))notify('Поле кнопки не знайдено')};
$('save').onclick=()=>{const b=doc?.getElementById('save');if(b&&!b.disabled){b.click();notify('Запущено збереження. Перевірте статус CMS.')}else notify('Збереження недоступне — перевірте авторизацію')};$('publish').onclick=()=>{const b=doc?.getElementById('publish');if(b&&!b.disabled){if(confirm('Опублікувати зміни на сайті?'))b.click()}else notify('Публікація недоступна — перевірте авторизацію')};$('add').onclick=()=>{doc?.getElementById('add')?.click();setTimeout(sync,100)};document.querySelectorAll('[data-rtab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-rtab]').forEach(x=>x.classList.toggle('active',x===b));activeTab=b.dataset.rtab;const native=doc?.querySelector('[data-inspector-tab="'+activeTab+'"]');native?.click();if(activeTab!=='content')notify('Детальні параметри доступні в підключеній CMS')});document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-device]').forEach(x=>x.classList.toggle('active',x===b));doc?.querySelector('[data-studio-device="'+b.dataset.device+'"]')?.click()});$('zoom').onclick=()=>doc?.getElementById('studioZoom')?.click();$('undo').onclick=()=>doc?.getElementById('studioUndo')?.click();$('redo').onclick=()=>doc?.getElementById('studioRedo')?.click();$('changePhoto').onclick=()=>{const f=doc?.querySelector('#existingEditor input[type=file],#editorFields input[type=file]');if(f)f.click();else notify('Завантаження фото для цього блоку недоступне')};$('editPhoto').onclick=()=>notify('Редактор кадрування буде підключений окремо');$('extra').onclick=()=>notify('Параметри редактора V2');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('sidehead').textContent=b.dataset.tab==='blocks'?'СТРУКТУРА СТОРІНКИ':b.dataset.tab==='pages'?'СТОРІНКИ САЙТУ':'СТИЛІ';if(b.dataset.tab==='blocks')sync();else notify('Розділ поки використовує існуючу CMS')})})();
</script></body></html>

name: CMS editor and publication regression
on:
  pull_request:
    paths:
      - 'admin/**'
      - 'cms-model.js'
      - 'cms-boot.*'
      - 'scripts/sync-cms-boot.cjs'
      - 'cms-published.js'
      - 'site.js'
      - 'capsules-front.js'
      - 'styles.css'
      - 'password-recovery.js'
      - 'order-delivery.js'
      - '*.html'
      - 'tests/**'
      - '.github/workflows/v2-smoke.yml'
  workflow_dispatch:
jobs:
  cms:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate runtime and recovery
        run: |
          node --check cms-model.js
          node --check password-recovery.js
          node --check order-delivery.js
          node --check capsules-front.js
          node --check admin/admin.js
          node tests/seo-editorial.mjs
          node --check cms-boot.js
          node scripts/sync-cms-boot.cjs --check
          node --check cms-published.js
          node --check admin/cms-builder.js
          node --check admin/cms-studio.js
          node --check admin/cms-photo-editor.js
          node --check admin/cms-button-editor.js
          node tests/cms-draft-store.cjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test editor and storefront with isolated data
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cms-server.log 2>&1 &
          node tests/cms-editor.cjs
          node tests/cms-layouts.cjs
          node tests/cms-legacy.cjs
          node tests/cms-shell.cjs
          node tests/cms-review.cjs
          node tests/cms-editor-refinements.cjs
          node tests/cms-native-photos.cjs
          node tests/cms-existing-buttons.cjs
          node tests/cms-block-isolation.cjs
          node tests/cms-text-columns.cjs
          node tests/cms-button-appearance.cjs
          node tests/cms-first-paint.cjs
          node tests/cms-entry-experience.cjs
          node tests/cms-visible-motion.cjs
          node tests/cms-page-choreography.cjs
          node tests/password-recovery.cjs
          node tests/storefront-performance.cjs
          node tests/product-card-motion.cjs
          node tests/responsive-layouts.cjs
          node tests/tablet-device-profiles.cjs
          node tests/cart-checkout.cjs
          node tests/capsule-orders.cjs
          node tests/home-presentation.cjs

name: CMS editor and publication regression
on:
  pull_request:
    paths:
      - 'admin/**'
      - 'supabase/**'
      - 'cms-model.js'
      - 'cms-boot.*'
      - 'scripts/sync-cms-boot.cjs'
      - 'cms-published.js'
      - 'site.js'
      - 'capsules-front.js'
      - 'styles.css'
      - 'storefront-ui.js'
      - 'checkout-feedback.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - 'scripts/build-hosting.mjs'
      - 'scripts/seo-deployment.mjs'
      - 'launch-site.json'
      - 'image-variants.js'
      - 'product-routes.js'
      - 'vh-seo-runtime.js'
      - 'vh-page-seo.js'
      - 'config.js'
      - 'assets/optimized/**'
      - 'scripts/product-routes.mjs'
      - 'scripts/seo-head.mjs'
      - 'password-recovery.js'
      - 'order-delivery.js'
      - '*.html'
      - 'tests/**'
      - '.github/workflows/v2-smoke.yml'
  workflow_dispatch:
jobs:
  cms:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated PostgreSQL test runtime
        run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - name: Validate runtime and recovery
        run: |
          node --check cms-model.js
          node --check storefront-ui.js
          node --check checkout-feedback.js
          node --check image-variants.js
          node --check product-routes.js
          node --check vh-seo-runtime.js
          node --check vh-page-seo.js
          node tests/prelaunch-unit.mjs
          node --check password-recovery.js
          node --check order-delivery.js
          node --check admin/cms-image-upload.js
          node --check admin/mobile.js
          node --check admin/cms-mobile.js
          node --check admin/viewport.js
          node --check measurements.js
          node --check admin/measurement-editor.js
          node tests/measurements-unit.cjs
          node tests/measurements-schema.mjs
          node tests/order-email-security.mjs
          node tests/order-email-version.mjs
          node --check capsules-front.js
          node --check admin/admin.js
          node tests/seo-editorial.mjs
          node --check cms-boot.js
          node scripts/sync-cms-boot.cjs --check
          node --check cms-published.js
          node --check admin/cms-builder.js
          node --check admin/cms-studio.js
          node --check admin/cms-photo-editor.js
          node --check admin/cms-button-editor.js
          node tests/cms-draft-store.cjs
      - name: Install browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify deployable assets and preview indexing
        run: |
          node tests/hosting-build.mjs
          node tests/seo-domain.cjs
      - name: Test editor and storefront with isolated data
        run: |
          export VH_TEST_BUILT=1
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cms-server.log 2>&1 &
          node tests/cms-editor.cjs
          node tests/cms-layouts.cjs
          node tests/cms-legacy.cjs
          node tests/cms-contact-fields.cjs
          node tests/cms-shell.cjs
          node tests/cms-shared-editing.cjs
          node tests/cms-review.cjs
          node tests/cms-editor-refinements.cjs
          node tests/cms-native-photos.cjs
          node tests/cms-existing-buttons.cjs
          node tests/cms-block-isolation.cjs
          node tests/cms-text-columns.cjs
          node tests/cms-column-position.cjs
          node tests/cms-preview-stability.cjs
          node tests/cms-button-appearance.cjs
          node tests/cms-first-paint.cjs
          node tests/cms-entry-experience.cjs
          node tests/cms-visible-motion.cjs
          node tests/cms-page-choreography.cjs
          node tests/password-recovery.cjs
          node tests/storefront-performance.cjs
          node tests/product-card-motion.cjs
          node tests/responsive-layouts.cjs
          node tests/tablet-device-profiles.cjs
          node tests/cart-checkout.cjs
          node tests/capsule-orders.cjs
          node tests/home-presentation.cjs
          node tests/home-mobile-copy.cjs
          node tests/mobile-storefront.cjs
          node tests/storefront-shell.cjs
          node tests/catalog-footer-spacing.cjs
          node tests/direct-order.cjs
          node tests/checkout-feedback.cjs
          node tests/cms-image-upload.cjs
          node tests/admin-mobile.cjs
          node tests/product-measurements.cjs
          node tests/measurement-persistence.cjs
          node tests/admin-login-mobile.cjs
          node tests/cms-mobile.cjs
      - name: Save isolated checkout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-checkout-screenshots
          path: test-results/prelaunch-feedback/
          if-no-files-found: ignore
      - name: Save isolated admin screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-mobile-screenshots
          path: test-results/admin-mobile/
          if-no-files-found: ignore

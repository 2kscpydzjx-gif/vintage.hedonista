name: Refresh product structured data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'seo-product/**'
      - 'scripts/build-product-jsonld.cjs'
permissions:
  contents: write
jobs:
  build-product-jsonld:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate structured data in static HTML
        run: node scripts/build-product-jsonld.cjs
      - name: Commit generated HTML when changed
        run: |
          if [ -n "$(git status --porcelain -- seo-product)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seo-product
            git commit -m "Update static Product JSON-LD in SEO pages"
            git push
          else
            echo "Product structured data already up to date"
          fi

name: Update SEO pages and sitemap
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate sitemap from publicly visible Supabase products
        run: node scripts/generate-sitemap.mjs
      - name: Build static product structured data
        run: node scripts/build-product-jsonld.cjs
      - name: Validate visible product fields against Supabase (read-only)
        run: node scripts/sync-product-seo.cjs --check
      - name: Audit generated SEO HTML
        run: node scripts/audit-seo.mjs
      - name: Refresh Merchant products and image sitemap (public reads only)
        run: node scripts/generate-merchant-feed.mjs
      - name: Commit updated sitemap if changed
        run: |
          git add -A robots.txt sitemap.xml google-merchant.xml catalog.html seo-product seo-article seo-category seo-subcategory product-routes.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update sitemap from published content"
            git push
          fi

name: Update SEO pages and sitemap
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate sitemap from published Supabase records
        run: node scripts/generate-sitemap.mjs
      - name: Build static product structured data
        run: node scripts/build-product-jsonld.cjs
      - name: Audit generated SEO HTML
        run: node scripts/audit-seo.mjs
      - name: Commit updated sitemap if changed
        run: |
          git add -A sitemap.xml seo-product seo-article
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update sitemap from published content"
            git push
          fi

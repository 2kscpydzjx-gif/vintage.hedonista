name: Audit internal product links
on:
  pull_request:
    paths:
      - 'scripts/audit-internal-links.mjs'
      - '.github/workflows/audit-internal-links.yml'
      - 'sitemap.xml'
      - 'seo-category/**'
      - 'seo-subcategory/**'
      - 'index.html'
      - 'catalog.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit static links to products
        run: node scripts/audit-internal-links.mjs

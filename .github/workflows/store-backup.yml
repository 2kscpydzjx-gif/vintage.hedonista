name: Encrypted store backup to Google Drive

on:
  schedule:
    - cron: '35 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'initialize once, then backup; retention requires a verified full restore'
        type: choice
        options: [backup, initialize, check, retention]
        default: backup
        required: true

permissions:
  contents: read

concurrency:
  group: vintazhka-encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.BACKUP_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout reviewed production code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install checksum-pinned backup tools
        run: |
          python3 scripts/backup/install_tools.py --directory "$RUNNER_TEMP/backup-tools"
          echo "$RUNNER_TEMP/backup-tools" >> "$GITHUB_PATH"
      - name: Verify supported commands before exposing credentials
        run: |
          supabase db dump --help >/dev/null
          supabase functions list --help >/dev/null
          supabase functions download --help >/dev/null
          restic restore --help >/dev/null
      - name: Execute selected backup operation
        env:
          BACKUP_DRIVE_TOKEN: ${{ secrets.BACKUP_DRIVE_TOKEN }}
          RESTIC_PASSWORD: ${{ secrets.BACKUP_RESTIC_PASSWORD }}
          BACKUP_REPOSITORY_ID: ${{ vars.BACKUP_REPOSITORY_ID }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_STORAGE_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_ACCESS_KEY }}
          BACKUP_STORAGE_SECRET_KEY: ${{ secrets.BACKUP_STORAGE_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.BACKUP_SUPABASE_ACCESS_TOKEN }}
          BACKUP_RESTORE_VERIFIED: ${{ vars.BACKUP_RESTORE_VERIFIED }}
          BACKUP_MODE: ${{ inputs.mode || 'backup' }}
          DO_NOT_TRACK: '1'
        run: python3 scripts/backup/run.py "$BACKUP_MODE"
      # No plaintext exports, credentials, traces or screenshots are uploaded as artifacts.
